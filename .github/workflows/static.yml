# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
#
# The group is deliberately NOT the template's "pages": a run wedged in the
# `waiting` state was holding that group and could not be cancelled (GitHub
# returned 500/502 on cancel and 422 on reject), so every later run queued
# behind it forever. A distinct group name means a zombie in the old group
# can never block deploys again.
#
# cancel-in-progress is true so a newer commit supersedes a queued older one
# rather than the two piling up. Pages deploys swap the artifact atomically,
# so superseding an in-flight one is safe.
concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
